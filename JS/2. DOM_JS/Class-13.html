<!-- Program: Fetch API and Rendering Dynamic Data -->

<html>

<head>
    <title>Class 13 - Fetch API & Dynamic Data</title>
</head>

<body>

    <h1>Class 13: Fetch API & Dynamic Data</h1>
    <p>Using <code>fetch()</code> to load data from an external REST API and displaying it on the webpage using plain HTML tags.</p>

    <!-- Trigger Button -->
    <button id="loadBtn" onclick="loadUsers()">Load Users from REST API</button>

    <p id="statusMessage"></p>

    <h3>Users Loaded from Server:</h3>
    <ul id="userList">
        <!-- Fetched users will be appended here -->
    </ul>

    <hr>

    <h3>Raw JSON Data from Server:</h3>
    <pre id="output">Click the button above to fetch data from API...</pre>

    <script>
        const userList = document.getElementById("userList");
        const statusMessage = document.getElementById("statusMessage");
        const loadBtn = document.getElementById("loadBtn");
        const output = document.getElementById("output");

        async function loadUsers() {
            // Show loading message & disable button
            statusMessage.innerText = "Loading data from server...";
            userList.innerHTML = "";
            loadBtn.disabled = true;

            try {
                // 1. fetch() sends HTTP GET request
                const response = await fetch("https://jsonplaceholder.typicode.com/users");

                // Check if request was successful
                if (!response.ok) {
                    throw new Error("HTTP Error Status: " + response.status);
                }

                // 2. Parse response JSON
                const users = await response.json();

                // 3. Render items as plain <li> elements in the DOM
                users.forEach(function(user) {
                    const li = document.createElement("li");
                    li.innerHTML = "<strong>" + user.name + "</strong> - " + user.email + " (" + user.address.city + ")";
                    userList.appendChild(li);
                });

                statusMessage.innerText = "Successfully loaded " + users.length + " users!";
                output.innerText = JSON.stringify(users.slice(0, 2), null, 2) + "\n... (" + (users.length - 2) + " more users)";

            } catch (error) {
                statusMessage.innerText = "Error loading users: " + error.message;
            } finally {
                loadBtn.disabled = false;
            }
        }
    </script>

    <!--
        ====================================================
        Class 13 Summary: Fetch API
        ====================================================

        1. Steps to Fetch Data:
           Step 1: const response = await fetch(url);
           Step 2: const data = await response.json();
           Step 3: Loop through data (e.g. data.forEach) and inject elements into the DOM.

        2. Error Handling:
           - Wrap fetch calls inside try...catch blocks to handle network issues gracefully.
    -->

</body>

</html>
