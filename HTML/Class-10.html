<!-- Program: Colspan and Rowspan -->

<html>

<head>

  <title>Colspan and Rowspan</title>

</head>

<body>

  <h1>Colspan and Rowspan</h1>
  <!-- Main heading of the webpage -->

  <p><b>Table Cell Merging Attributes</b></p>

  <ul>
    <li><b>colspan</b> - Merges two or more columns into a single column.</li>
    <li><b>rowspan</b> - Merges two or more rows into a single row.</li>
  </ul>

  <hr>

  <!-- Table demonstrating colspan and rowspan -->

  <table border="1">

    <tr>
      <th colspan="4" align="center">Student List</th>
    </tr>

    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Mark</th>
      <th>Remarks</th>
    </tr>

    <tr>
      <td>1</td>
      <td>Arun</td>
      <td>450</td>
      <td rowspan="2">Good</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Jose</td>
      <td>550</td>
    </tr>

  </table>

  <!--
        Table Cell Merging Attributes

        colspan : Merges two or more columns into a single cell.

        rowspan : Merges two or more rows into a single cell.
    -->

</body>

</html>
