<!-- Program: HTML Table -->

<html>

<head>

  <title>HTML Table</title>

</head>

<body>

  <h1>HTML Table</h1>
  <!-- Main heading of the webpage -->

  <p><b>HTML Table Tags</b></p>

  <ul>
    <li>&lt;table&gt; - Defines a table</li>
    <li>&lt;tr&gt; - Defines a table row</li>
    <li>&lt;th&gt; - Defines a table heading</li>
    <li>&lt;td&gt; - Defines table data (cell)</li>
  </ul>

  <hr>

  <!-- <table> is used to create a table -->

  <table border="1" width="500">

    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Mark</th>
    </tr>

    <tr>
      <td width="100">1</td>
      <td>Arun</td>
      <td>450</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Jose</td>
      <td>550</td>
    </tr>

  </table>

  <!--
        Common Table Attributes

        border : Specifies the border thickness of the table.

        width  : Specifies the width of the table.

        cellpadding : Specifies the space between the cell content and its border.

        cellspacing : Specifies the space between table cells.

        align : Specifies the alignment of the table.
                Values - left, center, right
    -->

</body>

</html>
