<!-- Program: HTML Form -->

<html>

<head>

   <title>HTML Form</title>

</head>

<body>

   <h1>HTML Form</h1>
   <!-- Main heading of the webpage -->

   <!-- <form> is used to collect user input -->

   <form method="post" enctype="multipart/form-data">

      <table border="3" cellpadding="5">

         <tr>
            <td>Name</td>
            <td>
               <input type="text" name="txt_name" placeholder="Enter Name">
            </td>
         </tr>

         <tr>
            <td>Gender</td>
            <td>
               <input type="radio" name="rd_gender" value="Male"> Male
               <input type="radio" name="rd_gender" value="Female"> Female
            </td>
         </tr>

         <tr>
            <td>Department</td>
            <td>
               <select name="sel_department">
                  <option>--Select--</option>
                  <option value="cs">Computer Science</option>
                  <option value="it">Information Technology</option>
               </select>
            </td>
         </tr>

         <tr>
            <td>Qualification</td>
            <td>
               <input type="checkbox" name="chk_mca" value="MCA"> MCA
               <input type="checkbox" name="chk_mba" value="MBA"> MBA
            </td>
         </tr>

         <tr>
            <td>Username</td>
            <td>
               <input type="text" name="txt_username">
            </td>
         </tr>

         <tr>
            <td colspan="2" align="center">
               <input type="button" name="btn_check" value="Check Availability">
            </td>
         </tr>

         <tr>
            <td>Password</td>
            <td>
               <input type="password" name="txt_password">
            </td>
         </tr>

         <tr>
            <td>Date of Birth</td>
            <td>
               <input type="date" name="txt_dob">
            </td>
         </tr>

         <tr>
            <td>Profile Photo</td>
            <td>
               <input type="file" name="file_photo">
            </td>
         </tr>

         <tr>
            <td>Address</td>
            <td>
               <textarea name="txt_address" rows="5" cols="30"></textarea>
            </td>
         </tr>

         <tr>
            <td colspan="2" align="center">
               <input type="submit" name="btn_submit" value="Submit">
               <input type="reset" name="btn_reset" value="Reset">
            </td>
         </tr>

      </table>

   </form>

   <!--
        Common Form Controls

        <form>      : Creates an HTML form.

        <input>     : Creates input controls.

        type="text"       : Creates a text box.

        type="radio"      : Creates a radio button.

        type="checkbox"   : Creates a check box.

        type="password"   : Creates a password field.

        type="date"       : Creates a date picker.

        type="file"       : Allows the user to select a file.

        type="button"     : Creates a normal button.

        type="submit"     : Creates a submit button.

        type="reset"      : Clears all form fields.

        <select>    : Creates a drop-down list.

        <option>    : Defines an item in the drop-down list.

        <textarea>  : Creates a multi-line text area.
    -->

</body>

</html>
