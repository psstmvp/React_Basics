<!-- Program: Image Tag -->

<html>

<head>

	<title>Image Tag</title>

</head>

<body>

	<h1>Image Tag</h1>
	<!-- Main heading of the webpage -->

	<!-- <img> is used to display an image on a webpage -->

	<p align="center">
		<img src="Images/Desert.jpg" width="150" height="150">
	</p>
	<!--
        Image Attributes

        src    : Specifies the path or name of the image.

        width  : Specifies the width of the image in pixels.

        height : Specifies the height of the image in pixels.
    -->

</body>

</html>
