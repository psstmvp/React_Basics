
<!-- Program: DIV Tag -->

<html>

<head>

    <title>DIV Tag</title>

</head>

<body>

    <h1>DIV Tag</h1>
    <!-- Main heading of the webpage -->

    <p>
        The &lt;div&gt; tag is used to divide a webpage into different sections.
    </p>

    <hr>

    <!-- Header Section -->
    <div style="border:1px solid black; padding:10px;">

        <h2>Header</h2>

        <p>Welcome to HTML Programming.</p>

    </div>

    <br>

    <!-- Content Section -->
    <div style="border:1px solid black; padding:10px;">

        <h2>Content</h2>

        <p>
            HTML is used to create the structure of a webpage.
        </p>

    
    </div>

    <br>

    <!-- Footer Section -->
    <div style="border:1px solid black; padding:10px;">

        <h2>Footer</h2>

        <p>Copyright © 2026</p>

    </div>

    <!--
        <div> Tag

        The <div> tag is used to divide or group
        different sections of a webpage.

        Common Uses

        - Header
        - Navigation Menu
        - Content
        - Sidebar
        - Footer
    -->

</body>

</html>
