<!-- Program: Nested Frames -->

<html>

<head>

    <title>Nested Frames</title>

</head>

<!-- Nested <frameset> is used to divide the browser window into multiple sections -->

<frameset cols="75%,25%">
    <!-- Divides the browser window into two vertical columns -->

    <frameset rows="50%,25%,25%">
        <!-- Divides the left column into three horizontal rows -->

        <frame src="class-9.html">
            <!-- Displays class-9.html -->

            <frame src="class-8.html">
                <!-- Displays class-8.html -->

                <frame src="class-7.html">
                    <!-- Displays class-7.html -->

    </frameset>

    <frameset rows="50%,15%,35%">
        <!-- Divides the right column into three horizontal rows -->

        <frame src="class-9.html">
            <!-- Displays class-9.html -->

            <frame src="class-8.html">
                <!-- Displays class-8.html -->

                <frame src="class-7.html">
                    <!-- Displays class-7.html -->

    </frameset>

</frameset>

<!--
    Common Frameset Attributes

    cols : Divides the browser window into vertical columns.

    rows : Divides the browser window into horizontal rows.

    src  : Specifies the webpage to be displayed inside a frame.
-->

</html>
