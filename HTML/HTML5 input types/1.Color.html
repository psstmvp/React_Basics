
<!-- Program: HTML5 Color Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Color Input</title>

</head>

<body>

    <h1>HTML5 Color Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="color"</b> is used for input fields
        that should contain a color.
    </p>

    <p>
        Depending on browser support, a color picker may appear
        when you click inside the input field.
    </p>

    <hr>

    <form>

        <table border="1" cellpadding="5">

            <tr>
                <td>Select Your Favourite Color</td>
                <td>
                    <input type="color" name="txt_color" value="#ffffff">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="color"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
