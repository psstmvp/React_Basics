
<!-- Program: HTML5 Range Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Range Input</title>

</head>

<body>

    <h1>HTML5 Range Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="range"</b> is used to select a value
        within a specified range.
    </p>

    <p>
        Depending on browser support, the range input is displayed
        as a slider control.
    </p>

    <hr>

    <form method="get">

        <table border="1" cellpadding="5">

            <tr>
                <td>Points (0 - 10)</td>
                <td>
                    <input type="range" name="txt_points" min="0" max="10">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="range"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
