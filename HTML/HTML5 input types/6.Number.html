
<!-- Program: HTML5 Number Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Number Input</title>

</head>

<body>

    <h1>HTML5 Number Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="number"</b> is used for input fields
        that should contain numeric values.
    </p>

    <p>
        The <b>min</b> and <b>max</b> attributes are used to
        specify the minimum and maximum values allowed.
    </p>

    <hr>

    <form>

        <table border="1" cellpadding="5">

            <tr>
                <td>Quantity (1 - 5)</td>
                <td>
                    <input type="number" name="txt_quantity" min="1" max="5">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="number"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
