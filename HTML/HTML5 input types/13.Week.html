
<!-- Program: HTML5 Week Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Week Input</title>

</head>

<body>

    <h1>HTML5 Week Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="week"</b> is used for input fields
        that allow the user to select a week and year.
    </p>

    <p>
        Depending on browser support, a week picker may appear
        when you click inside the input field.
    </p>

    <hr>

    <form>

        <table border="1" cellpadding="5">

            <tr>
                <td>Select Week</td>
                <td>
                    <input type="week" name="txt_week">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="week"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
