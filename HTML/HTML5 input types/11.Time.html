<!-- Program: HTML5 Time Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Time Input</title>

</head>

<body>

    <h1>HTML5 Time Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="time"</b> is used for input fields
        that allow the user to select a time.
    </p>

    <p>
        Depending on browser support, a time picker may appear
        when you click inside the input field.
    </p>

    <hr>

    <form>

        <table border="1" cellpadding="5">

            <tr>
                <td>Select Time</td>
                <td>
                    <input type="time" name="txt_time">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="time"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
