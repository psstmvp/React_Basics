
<!-- Program: HTML5 Date Input -->

<!DOCTYPE html>
<!-- Declares the document type as HTML5 -->

<html>

<head>

    <title>HTML5 Date Input</title>

</head>

<body>

    <h1>HTML5 Date Input</h1>
    <!-- Main heading of the webpage -->

    <p>
        The <b>input type="date"</b> is used for input fields
        that should contain a date.
    </p>

    <p>
        Depending on browser support, a date picker may appear
        when you click inside the input field.
    </p>

    <hr>

    <form>

        <table border="1" cellpadding="5">

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date" name="txt_date">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit">
                    <input type="reset" name="btn_reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <b>Note:</b> The <b>type="date"</b> input may not be
        supported in some older web browsers.
    </p>

</body>

</html>
