<!-- Program: Frames -->

<html>

<head>

	<title>Frames</title>

</head>

<!-- <frameset> divides the browser window into multiple frames -->

<frameset cols="50%,50%">
	<!-- cols divides the page vertically into columns -->

	<frame src="class-9.html">
		<!-- Displays the contents of class-9.html -->

		<frame src="class-8.html">
			<!-- Displays the contents of class-8.html -->

</frameset>

<!--
    Frameset Attributes

    cols : Divides the browser window into vertical columns.

    rows : Divides the browser window into horizontal rows.

    src  : Specifies the webpage to be displayed inside a frame.
-->

</html>
