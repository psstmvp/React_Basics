<!-- Program: Internal CSS -->

<html>

<head>
    <title>Internal CSS</title>

    <style>
        /* CSS style rules are written inside the <style> tag in the head section */

        h1 {
            color: purple; /* Styles all <h1> headings on this page purple */
        }

        p {
            color: green; /* Styles all <p> paragraphs on this page green */
            font-size: 18px; /* Styles all <p> paragraphs to be 18 pixels in size */
        }
    </style>
</head>

<body>

    <h1>Internal CSS Example</h1>
    <!-- This heading will be purple -->

    <p>This is paragraph text styled using Internal CSS.</p>
    <!-- This paragraph will be green and 18px size -->

    <p>All paragraphs on this page will automatically share this styling.</p>
    <!-- This paragraph will also be green and 18px size -->

    <!--
        Internal CSS

        Internal CSS is used to style a single HTML page. It is written inside the 
        <style> element, which is placed inside the <head> section.

        Syntax:
        selector {
            property: value;
        }

        Examples:
        - h1 is the selector (targets all <h1> tags).
        - color is the property.
        - purple is the value.
    -->

</body>

</html>
