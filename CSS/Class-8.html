<!-- Program: Background Color -->

<html>

<head>
    <title>Background Color</title>

    <style>
        /* Sets the background color of the entire webpage */
        body {
            background-color: lightcyan;
        }

        /* Sets background color for all heading 1 tags */
        h1 {
            background-color: darkblue;
            color: white; /* White text on blue background */
        }

        /* Sets background color for a paragraph with a specific class */
        .yellow-box {
            background-color: yellow;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Background Color Example</h1>
    <!-- Heading with a dark blue background -->

    <p>This page has a light cyan background color.</p>
    <!-- Background is styled by the body selector -->

    <p class="yellow-box">This paragraph acts as a yellow box because of its class styling.</p>
    <!-- Paragraph with a yellow background -->

    <!--
        Background Color

        The 'background-color' property sets the background color of an element.

        Syntax:
        background-color: color-name;

        Common Values:
        - color names (e.g. red, yellow, lightgreen, lightcyan)
        - hex codes (e.g. #ff0000)
        - rgb codes (e.g. rgb(255, 0, 0))
    -->

</body>

</html>
