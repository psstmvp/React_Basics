<!-- Program: External CSS -->

<html>

<head>
    <title>External CSS</title>

    <link rel="stylesheet" href="styles.css">
    <!-- The link tag connects our HTML page to the external CSS file named styles.css -->
</head>

<body>

    <h1>External CSS Example</h1>
    <!-- This heading will be styled by the styles.css file (dark red) -->

    <p>This paragraph is styled by an external stylesheet file.</p>
    <!-- This paragraph will be styled by the styles.css file (dark green) -->

    <!--
        External CSS

        External CSS is written in a separate stylesheet file (with a .css extension)
        and linked to the HTML file.

        How to link:
        We use the <link> tag inside the <head> section:
        <link rel="stylesheet" href="filename.css">

        Why use External CSS?
        - You can style multiple pages from a single CSS file.
        - Keeps your HTML code neat and organized.
    -->

</body>

</html>
