<!-- Program: Text Properties -->

<html>

<head>
    <title>Text Properties</title>

    <style>
        .centered-title {
            text-align: center; /* Aligns text in the center */
        }

        .right-text {
            text-align: right; /* Aligns text to the right side */
        }

        .underlined-p {
            text-decoration: underline; /* Adds an underline to text */
        }

        .crossed-p {
            text-decoration: line-through; /* Draws a line through text */
        }
    </style>
</head>

<body>

    <h1 class="centered-title">Centered Heading</h1>
    <!-- Aligned to the center -->

    <p class="right-text">This paragraph is aligned to the right side of the screen.</p>
    <!-- Aligned to the right -->

    <p class="underlined-p">This text is styled with an underline.</p>
    <!-- Underlined text -->

    <p class="crossed-p">This text is crossed out using line-through decoration.</p>
    <!-- Crossed out text -->

    <!--
        Text Properties

        CSS provides properties to format the alignment and decoration of text.

        Properties:
        1. text-align: Aligns text horizontally.
           - left (default)
           - center
           - right
           - justify

        2. text-decoration: Adds styling decorations to text.
           - none (removes decorations, useful for removing link underlines)
           - underline
           - line-through
    -->

</body>

</html>
