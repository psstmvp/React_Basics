<!-- Program: HTML Tag Selector -->

<html>

<head>
    <title>HTML Tag Selector</title>

    <style>
        /* Tag selectors target elements by their HTML tag name directly */

        h1 {
            color: darkorange; /* All <h1> tags will be dark orange */
        }

        h2 {
            color: darkblue; /* All <h2> tags will be dark blue */
        }

        p {
            color: gray; /* All <p> tags will be gray */
        }
    </style>
</head>

<body>

    <h1>Tag Selector Example</h1>
    <!-- Targeted by h1 selector -->

    <h2>Heading 2 Title</h2>
    <!-- Targeted by h2 selector -->

    <p>This is a paragraph styled using the tag selector 'p'.</p>
    <!-- Targeted by p selector -->

    <h2>Another Heading 2 Title</h2>
    <!-- Targeted by h2 selector and will also be dark blue -->

    <p>Another paragraph that will also be styled gray.</p>
    <!-- Targeted by p selector and will also be gray -->

    <!--
        HTML Tag Selector (Element Selector)

        The Tag Selector is used to target all elements with a specific HTML tag.

        Syntax:
        tagname {
            property: value;
        }

        Examples:
        - h1 { color: darkorange; }
        - p { color: gray; }
    -->

</body>

</html>
