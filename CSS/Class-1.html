    <!--
        Introduction to CSS

        1. What is CSS?
           CSS stands for Cascading Style Sheets.
           It is used to design and style HTML web pages.

        2. Why do we use CSS?
           - To change text colors and sizes.
           - To set background colors or background images.
           - To add borders, space, and organize web pages.
