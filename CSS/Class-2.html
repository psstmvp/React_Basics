<!-- Program: Inline CSS -->

<html>

<head>
    <title>Inline CSS</title>
</head>

<body>

    <h1>Inline CSS Example</h1>

    <h2 style="color: red;">Red Sub-heading</h2>
    <!-- Inline style changing color to red -->

    <p style="color: blue; font-size: 20px;">This is blue text with a larger font size of 20 pixels.</p>
    <!-- Inline style changing color to blue and font-size to 20px -->

    <p style="background-color: yellow;">This text has a yellow background color.</p>
    <!-- Inline style changing background-color to yellow -->

    <!--
        Inline CSS

        Inline CSS is written directly inside the HTML tag using the 'style' attribute.

        Syntax:
        style="property: value;"

        Examples:
        - style="color: red;"
        - style="font-size: 20px;"
        - style="background-color: yellow;"

        Note: When writing multiple properties, they must be separated by a semicolon (;).
    -->

</body>

</html>
