<!-- Program: Font Properties -->

<html>

<head>
    <title>Font Properties</title>

    <style>
        .arial-text {
            font-family: Arial, Helvetica, sans-serif; /* Changes the font type to Arial */
        }

        .courier-text {
            font-family: 'Courier New', Courier, monospace; /* Changes font to monospaced type */
        }

        .large-text {
            font-size: 28px; /* Increases text size to 28 pixels */
        }

        .bold-text {
            font-weight: bold; /* Makes the font bold */
        }
    </style>
</head>

<body>

    <h1>Font Properties Example</h1>

    <p class="arial-text">This paragraph is styled in Arial font style.</p>
    <!-- Styled with Arial -->

    <p class="courier-text">This paragraph is styled in Courier New monospace style.</p>
    <!-- Styled with Courier New -->

    <p class="large-text">This is large font size text (28px).</p>
    <!-- Large text -->

    <p class="bold-text">This is bold font weight text.</p>
    <!-- Bold text -->

    <p class="courier-text large-text bold-text">This is large, bold Courier New text combined!</p>
    <!-- Combined styles -->

    <!--
        Font Properties

        Font properties control how text characters look on the webpage.

        Properties:
        1. font-family: Specifies the font style type.
           - Arial, sans-serif
           - Times New Roman, serif
           - Courier New, monospace

        2. font-size: Sets the size of text.
           - Can be in pixels (e.g. 16px, 24px) or other units.

        3. font-weight: Controls the boldness thickness of characters.
           - normal
           - bold
    -->

</body>

</html>
