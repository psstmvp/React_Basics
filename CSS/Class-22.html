<!-- Program: CSS Grid - Column and Row Spanning -->

<html>

<head>
    <title>CSS Grid - Spanning</title>

    <style>
        .grid-item {
            background-color: #607d8b;
            color: white;
            padding: 20px;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
            gap: 12px;
            background-color: #f1f1f1;
            padding: 15px;
            border: 2px solid #ccc;
        }

        /* Span 3 columns (full width header/footer) */
        .header {
            grid-column: span 3;
            background-color: #e91e63;
        }

        /* Span 2 columns */
        .main-article {
            grid-column: span 2;
            background-color: #2196f3;
        }

        /* 1 column sidebar */
        .sidebar {
            background-color: #ff9800;
        }

        /* Span 3 columns */
        .footer {
            grid-column: span 3;
            background-color: #4caf50;
        }
    </style>
</head>

<body>

    <h1>CSS Grid - Spanning Example</h1>

    <div class="grid-container">
        <div class="grid-item header">Header (grid-column: span 3)</div>
        <div class="grid-item main-article">Main Article (grid-column: span 2)</div>
        <div class="grid-item sidebar">Sidebar (1 column)</div>
        <div class="grid-item footer">Footer (grid-column: span 3)</div>
    </div>

    <!--
        CSS Grid - Column and Row Spanning

        Grid items can span across multiple columns or rows to create complete webpage layouts.

        Properties:
        1. grid-column:
           - Controls horizontal space occupied by an item.
           - grid-column: span 2; -> spans across 2 column tracks.
           - grid-column: span 3; -> spans across 3 column tracks.
           - grid-column: 1 / 3;  -> starts at grid line 1 and ends at grid line 3.

        2. grid-row:
           - Controls vertical space occupied by an item across rows.
           - grid-row: span 2; -> spans across 2 row tracks.
    -->

</body>

</html>
