<!-- Program: Flexbox - Display and Direction -->

<html>

<head>
    <title>Flexbox - Direction</title>

    <style>
        .flex-item {
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            text-align: center;
            border-radius: 4px;
        }

        /* Row Layout: items arranged side by side horizontally */
        .flex-row {
            display: flex;             /* Activates flexbox layout */
            flex-direction: row;       /* Arranges items horizontally from left to right (default) */
            gap: 15px;                 /* Space between items */
            background-color: #f1f1f1;
            padding: 15px;
            border: 2px solid #ccc;
            margin-bottom: 25px;
        }

        /* Column Layout: items stacked vertically */
        .flex-column {
            display: flex;
            flex-direction: column;    /* Arranges items vertically from top to bottom */
            gap: 10px;
            background-color: #e8f4f8;
            padding: 15px;
            border: 2px solid #bce8f1;
        }
    </style>
</head>

<body>

    <h1>Flexbox - Direction Example</h1>

    <h3>1. Row Direction (flex-direction: row)</h3>
    <div class="flex-row">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <h3>2. Column Direction (flex-direction: column)</h3>
    <div class="flex-column">
        <div class="flex-item">Item A</div>
        <div class="flex-item">Item B</div>
        <div class="flex-item">Item C</div>
    </div>

    <!--
        Flexbox - Display and Direction

        Flexbox (Flexible Box) makes it easy to align and distribute items in a container.

        Key Properties:
        1. display: flex;
           - Enables flexbox for all direct child elements.

        2. flex-direction:
           - row (default): Places items horizontally from left to right.
           - column: Places items vertically from top to bottom.
           - row-reverse: Places items horizontally in reverse order (right to left).
           - column-reverse: Places items vertically in reverse order (bottom to top).
    -->

</body>

</html>
